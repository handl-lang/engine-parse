[package]
name = "hnl-engine-parse"
version = "0.1.0"
edition = "2024"
description = "The abstraction crate for the parse operation (ADR-0044 §3)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-parse"
homepage = "https://handl-lang.github.io/docs/engine-parse/"
documentation = "https://handl-lang.github.io/docs/engine-parse/reference/"
readme = "README.md"
keywords = ["handl", "engine", "parser", "language-as-data"]
categories = ["parser-implementations", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-parse (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
